<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malayalam Enhanced InScript Keyboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:Arial,"Noto Sans Malayalam",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:20px}
h1{text-align:center;margin:0;font-family:Georgia,serif;font-size:34px}
.sub{text-align:center;color:#9da7b3;margin:5px 0 18px}
.panel{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px}
textarea{width:100%;height:180px;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:10px;padding:15px;font:24px/1.7 "Noto Sans Malayalam",Arial,sans-serif;resize:vertical;outline:none}
textarea:focus{border-color:#58a6ff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 15px}
button{font:inherit}
.action{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:7px;padding:8px 12px;cursor:pointer}
.action:hover{background:#30363d}
.status{margin-left:auto;color:#8b949e;font-size:13px}
.keyboard{overflow-x:auto}
.row{display:flex;gap:5px;min-width:1030px;justify-content:center;margin-bottom:5px}
.key{width:68px;height:62px;background:#21262d;border:1px solid #444c56;border-radius:6px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.key:hover{background:#30363d}
.key:active{transform:translateY(1px)}
.key .ml{font-size:23px;line-height:1}
.key .shiftlabel{font-size:13px;color:#f85149;margin-top:5px;font-weight:bold}
.key .latin{font-size:10px;color:#8b949e;margin-top:4px}
.key.wide{width:105px}.key.space{width:350px}.key.enter{width:100px}
.key.active{outline:2px solid #58a6ff;background:#30363d}
.special-title{margin:20px 0 8px;font-weight:bold}
.specials{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.special{background:#21262d;border:1px solid #30363d;border-radius:7px;padding:8px;color:white;cursor:pointer;text-align:center}
.special strong{display:block;font-size:23px}
.special span{display:block;color:#f85149;font-size:11px;margin-top:5px}
@media(max-width:700px){.wrap{padding:8px}h1{font-size:27px}.panel{padding:9px}.specials{grid-template-columns:repeat(2,1fr)}textarea{height:140px;font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<h1>മലയാളം TYPING — UBUNTU 22.04</h1>
<div class="sub">Malayalam Enhanced InScript • Complete Unicode keyboard</div>
<div class="panel">
<textarea id="editor" spellcheck="false" placeholder="ഇവിടെ മലയാളം ടൈപ്പ് ചെയ്യുക..."></textarea>
<div class="toolbar">
<button class="action" id="copy">📋 Copy</button>
<button class="action" id="clear">Clear</button>
<button class="action" id="undo">Undo</button>
<button class="action" id="redo">Redo</button>
<button class="action" id="mode">മലയാളം / English</button>
<span class="status" id="status">Malayalam • 0 characters</span>
</div>
<div id="keyboard" class="keyboard"></div>
<div class="special-title">Special combinations / chillus / conjuncts</div>
<div id="specials" class="specials"></div>
</div>
</div>

<script>
const editor=document.getElementById("editor");
let mlMode=true;

/* Exact two-level mapping from the Linux xkeyboard-config
   Malayalam "mal_enhanced" layout. */
const K={
"`":["ഒ","ഓ"],"1":["൧","!"],"2":["൨","@"],"3":["൩","#"],"4":["൪","$"],
"5":["൫","%"],"6":["൬","^"],"7":["൭","&"],"8":["൮","~"],"9":["൯","("],
"0":["൦",")"],"-":["-","ഃ"],"=":["ൃ","ഋ"],

"q":["ൌ","ഔ"],"w":["ൈ","ഐ"],"e":["ാ","ആ"],"r":["ീ","ഈ"],"t":["ൂ","ഊ"],
"y":["ബ","ഭ"],"u":["ഹ","ങ"],"i":["ഗ","ഘ"],"o":["ദ","ധ"],"p":["ജ","ഝ"],
"[":["ഡ","ഢ"],"]":["‍","ഞ"],"\\":["\u200c","\\ "],

"a":["ോ","ഓ"],"s":["േ","ഏ"],"d":["്","അ"],"f":["ി","ഇ"],"g":["ു","ഉ"],
"h":["പ","ഫ"],"j":["ര","റ"],"k":["ക","ഖ"],"l":["ത","ഥ"],";":["ച","ഛ"],
"'":["ട","ഠ"],

"z":["െ","എ"],"x":["ം","ൺ"],"c":["മ","ണ"],"v":["ന","ൻ"],"b":["വ","ഴ"],
"n":["ല","ള"],"m":["സ","ശ"],",":[",","ഷ"],".":[".","ൽ"],"/":["യ","?"]
};

// Visual key rows from the supplied chart.
const rows=[
["`","1","2","3","4","5","6","7","8","9","0","-","="],
["q","w","e","r","t","y","u","i","o","p","[","]","\\"],
["a","s","d","f","g","h","j","k","l",";","'"],
["z","x","c","v","b","n","m",",",".","/"]
];

function label(k,shift){
 let v=K[k] ? K[k][shift?1:0] : k;
 if(k==="\\") v=shift?"\\":"‌";
 return v;
}
function insertText(s){
 if(!s)return;
 const a=editor.selectionStart,b=editor.selectionEnd;
 editor.setRangeText(s,a,b,"end");editor.focus();update();
}
function typeKey(k,shift=false){
 if(k==="SPACE"){insertText(" ");return}
 if(k==="ENTER"){insertText("\n");return}
 if(k==="BACK"){backspace();return}
 insertText(label(k,shift));
}
function backspace(){
 const a=editor.selectionStart,b=editor.selectionEnd;
 if(a!==b)editor.setRangeText("",a,b,"end");
 else if(a>0)editor.setRangeText("",a-1,a,"end");
 editor.focus();update();
}
function makeKey(k){
 const b=document.createElement("button");b.className="key";b.type="button";
 const v=K[k]||[k,k];
 b.innerHTML=`<span class="ml">${v[0]}</span><span class="shiftlabel">${v[1]}</span><span class="latin">${k}</span>`;
 b.onclick=()=>typeKey(k,false);
 b.oncontextmenu=e=>{e.preventDefault();typeKey(k,true)};
 return b;
}
function render(){
 const kb=document.getElementById("keyboard");kb.innerHTML="";
 rows.forEach(keys=>{
  const r=document.createElement("div");r.className="row";
  keys.forEach(k=>r.appendChild(makeKey(k)));
  kb.appendChild(r);
 });
 const r=document.createElement("div");r.className="row";
 const sh=document.createElement("button");sh.className="key wide";
 sh.innerHTML='<span class="ml">Shift</span><span class="shiftlabel">SHIFT</span><span class="latin">hold physical Shift</span>';
 r.appendChild(sh);
 const sp=document.createElement("button");sp.className="key space";
 sp.innerHTML='<span class="ml">␠</span><span class="shiftlabel">SPACE</span>';sp.onclick=()=>typeKey("SPACE");r.appendChild(sp);
 const ba=document.createElement("button");ba.className="key wide";
 ba.innerHTML='<span class="ml">⌫</span><span class="shiftlabel">BACKSPACE</span>';ba.onclick=()=>typeKey("BACK");r.appendChild(ba);
 const en=document.createElement("button");en.className="key enter";
 en.innerHTML='<span class="ml">↵</span><span class="shiftlabel">ENTER</span>';en.onclick=()=>typeKey("ENTER");r.appendChild(en);
 kb.appendChild(r);
}

const special=[
["ൻ","V + D + ]"],["ൽ","N + D + ]"],["ർ","J + D + ]"],["ൺ","Shift+C + D + ]"],["ൾ","Shift+N + D + ]"],
["ങ്ങ","Shift+U + D + K"],["ന്ത","V + D + L"],["ഞ്ച","Shift+} + D + ;"],["ണ്ട","Shift+C + D + \""] ,["മ്പ","C + D + H"],
["ക്ഷ","K + D + Shift+<"],["ക്ക","K + D + K"],["ച്ച","; + D + ;"],["ഞ്ഞ","Shift+} + D + Shift+}"],
["ട്ട","' + D + '"],["ണ്ണ","Shift+C + D + Shift+C"],["ത്ത","L + D + L"],["ന്ന","V + D + V"],
["മ്മ","C + D + C"],["ല്ല","N + D + N"],["വ്വ","B + D + B"],["യ്യ","/ + D + /"],
["ശ്ശ","Shift+M + D + Shift+M"],["സ്സ","M + D + M"],["ള്ള","Shift+N + D + Shift+N"],["റ്റ","Shift+J + D + Shift+J"],
["ക്ര","K + D + J"],["ക്യ","K + D + /"],["ക്വ","K + D + B"],["ന്റ","V + D + Shift+J"]
];
const sg=document.getElementById("specials");
special.forEach(([out,keys])=>{
 const b=document.createElement("button");b.className="special";
 b.innerHTML=`<strong>${out}</strong><span>${keys}</span>`;
 b.onclick=()=>insertText(out);sg.appendChild(b);
});

document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.altKey||e.metaKey)return;
 if(!mlMode)return;
 if(e.key==="Backspace"){e.preventDefault();backspace();return}
 if(e.key==="Enter"){e.preventDefault();insertText("\n");return}
 if(e.key===" "){e.preventDefault();insertText(" ");return}
 const k=e.key.toLowerCase();
 if(e.key.length===1 && K[k]){
   e.preventDefault();insertText(label(k,e.shiftKey));
 }
});
document.getElementById("copy").onclick=async()=>{
 await navigator.clipboard.writeText(editor.value);
 document.getElementById("status").textContent="Copied ✓";
 setTimeout(update,900);
};
document.getElementById("clear").onclick=()=>{editor.value="";update();editor.focus()};
document.getElementById("undo").onclick=()=>document.execCommand("undo");
document.getElementById("redo").onclick=()=>document.execCommand("redo");
document.getElementById("mode").onclick=()=>{
 mlMode=!mlMode;
 document.getElementById("status").textContent=(mlMode?"Malayalam":"English")+" • "+editor.value.length+" characters";
};
function update(){document.getElementById("status").textContent=(mlMode?"Malayalam":"English")+" • "+editor.value.length+" characters"}
editor.addEventListener("input",update);
render();update();
</script>
</body>
</html>
